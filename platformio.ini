; =============================================================================
;  AirSense Pro — PlatformIO Mono-Repo Configuration
; =============================================================================

[platformio]
default_envs  = nano-usb
extra_configs = secrets.ini

; ---------------------------------------------------------------------------
; [env:base]  — shared settings inherited by every environment
; ---------------------------------------------------------------------------
[env:base]
framework     = arduino
monitor_speed = 115200
lib_ldf_mode  = deep+

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_FREERTOS_UNICORE=0

lib_deps =
    knolleary/PubSubClient @ ^2.8.0
    bblanchon/ArduinoJson  @ ^7.1.0

; ---------------------------------------------------------------------------
; [env:nano-usb]  — first-time USB flash for the Nano ESP32
; ---------------------------------------------------------------------------
[env:nano-usb]
extends         = env:base
board           = arduino_nano_esp32
platform        = espressif32 @ ^6.9.0
upload_protocol = esptool
upload_port     = /dev/ttyACM0 ;COM12
upload_speed    = 115200

build_src_filter = +<nano/> -<cyd/>

build_flags =
    ${env:base.build_flags}
    -DNODE_NAME=\"NanoSensor\"
    -DMQTT_TOPIC_ROOT=\"airsense/room1\"
    -DOTA_HOSTNAME=\"airsense-nano\"
    -DSENSOR_INTERVAL_MS=10000

lib_deps =
    ${env:base.lib_deps}
    dfrobot/DFRobot_ENS160  @ ^1.0.1
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BusIO @ ^1.16.1

; ---------------------------------------------------------------------------
; [env:nano]  — OTA upload to Nano (after first USB flash)
;               Replace 192.168.1.xxx with IP shown in Serial Monitor
; ---------------------------------------------------------------------------
[env:nano]
extends         = env:nano-usb
upload_protocol = espota
upload_port     = 10.99.188.201
upload_speed    = 921600
upload_flags    = --auth=airsense_pro26

; ---------------------------------------------------------------------------
; [env:cyd-usb]  — first-time USB flash for the CYD 7"
; ---------------------------------------------------------------------------
[env:cyd-usb]
extends         = env:base
board           = esp32-s3-devkitc-1
platform        = espressif32 @ ^6.9.0
upload_protocol = esptool
upload_port     =
upload_speed    = 921600

build_src_filter = +<cyd/> -<nano/>

board_build.partitions          = huge_app.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_upload.maximum_ram_size   = 327680

build_flags =
    ${env:base.build_flags}
    -DNODE_NAME=\"CYDDisplay\"
    -DMQTT_TOPIC_ROOT=\"airsense/room1\"
    -DOTA_HOSTNAME=\"airsense-cyd\"
    -DLVGL_TICK_PERIOD_MS=2
    -DDISPLAY_WIDTH=800
    -DDISPLAY_HEIGHT=480
    -DTOUCH_SDA=19
    -DTOUCH_SCL=20
    -DTOUCH_INT=18
    -DTOUCH_RST=38
    -DBUZZER_PIN=2
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    ${env:base.lib_deps}
    lvgl/lvgl            @ ^8.3.11
    lovyan03/LovyanGFX   @ ^1.1.16
    bitbank2/bb_captouch @ ^1.2.0

; ---------------------------------------------------------------------------
; [env:cyd]  — OTA upload to CYD (after first USB flash)
;              Replace 192.168.1.xxx with IP shown in Serial Monitor
; ---------------------------------------------------------------------------
[env:cyd]
extends         = env:cyd-usb
upload_protocol = espota
upload_port     = 192.168.1.xxx
upload_speed    = 921600
upload_flags    = --auth=airsense_pro26